# Keywords to look for in paper titles or abstracts
keywords:
  - "video generation"
  - "image generation"
  - "text-to-video"
  - "text-to-image"
  - "diffusion model"
  - "model efficiency"
  - "efficient inference"
  - "quantization"
  - "multimodal foundation model"
  - "vision language model architecture"

# Categories for grouping reports
categories:
  - name: "Generative Media"
    emoji: "🎥"
    description: "Video and image generation, diffusion models, text-to-media."
  - name: "Model Efficiency"
    emoji: "⚡"
    description: "Quantization, efficient inference, model compression."
  - name: "Multimodal Foundation"
    emoji: "🌐"
    description: "Multimodal architecture, vision-language models."
  - name: "General AI"
    emoji: "🤖"
    description: "Other interesting AI papers matching keywords."

# Time to run the report (24-hour format, ET)
# 18:00 ET is 23:00 UTC (1 hour before UTC day switch)
schedule_time: "18:00"

# Maximum number of papers to analyze and send per run
max_papers: 5