# Keywords to look for in paper titles or abstracts
keywords:
  - "something"

# Categories for grouping reports
categories:
  - name: "Something"
    emoji: "🤖"
    description: "Something."

# Time to run the report (24-hour format, UTC)
# 23:00 UTC is 1 hour before UTC day switch (midnight)
schedule_time: "23:00"

# Maximum number of papers to analyze and send per run
max_papers: 5