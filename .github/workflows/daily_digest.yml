name: Daily Paper Digest

on:
  schedule:
    # Runs at 03:00 UTC on Tue, Wed, Thu, Fri, Sat
    # This corresponds to 10:00 PM EST (UTC-5) or 11:00 PM EDT (UTC-4) on Mon-Fri
    - cron: '0 3 * * 2-6'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r daily_paper_digest/requirements.txt

      - name: Run Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run.py --run-now
