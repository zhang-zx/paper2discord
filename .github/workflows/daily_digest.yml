name: Daily Paper Digest

on:
  schedule:
    # Runs at 23:00 UTC on Mon, Tue, Wed, Thu, Fri
    # This is 1 hour before UTC midnight (Hugging Face date switch)
    # Corresponds to 6:00 PM EST / 7:00 PM EDT
    - cron: '0 23 * * 1-5'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r daily_paper_digest/requirements.txt

      - name: Run Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run.py --run-now
